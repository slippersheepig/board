<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>忙人免进</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- 金色半月透明背景 + 双层光晕 favicon -->
  <link rel="icon"
        href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><radialGradient id='goldGrad' cx='50%' cy='50%' r='50%'><stop offset='0%' stop-color='%23fff8dc'/><stop offset='50%' stop-color='%23ffd700'/><stop offset='100%' stop-color='%23b8860b'/></radialGradient><filter id='doubleGlow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur in='SourceGraphic' stdDeviation='6' result='outerBlur'/><feGaussianBlur in='SourceGraphic' stdDeviation='2' result='innerBlur'/><feMerge><feMergeNode in='outerBlur'/><feMergeNode in='innerBlur'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs><path d='M50 5 A45 45 0 1 0 50 95 A25 45 0 1 1 50 5' fill='url(%23goldGrad)' filter='url(%23doubleGlow)'/></svg>">

  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <meta name="theme-color" content="#02050a">
</head>
<body>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <header id="topbar">
    <div id="topTitle">
      <div class="title">失落文明</div>
      <div class="subtitle">🌌🌌🌌🌌🌌🌌</div>
    </div>
  </header>

  <main id="container">
    <div id="centerColumn">
      <div id="clockCard" class="card">
        <!-- SVG 时钟 -->
        <svg id="clockSVG" viewBox="0 0 300 300" class="clockSVG" preserveAspectRatio="xMidYMid meet" aria-label="时钟">
          <defs>
            <radialGradient id="clockGrad">
              <stop offset="0%" stop-color="#0b1220" stop-opacity="0.08"/>
              <stop offset="68%" stop-color="#071827" stop-opacity="0.03"/>
              <stop offset="100%" stop-color="#040a12" stop-opacity="0.0"/>
            </radialGradient>
          </defs>

          <g id="clockGroup" transform="translate(150,150)">
            <circle r="140" fill="url(#clockGrad)" stroke="#66d9ff" stroke-opacity="0.55" stroke-width="3"></circle>
            <g id="pendulumGroup" transform="translate(0,34)">
              <line id="pendulumRod" x1="0" y1="0" x2="0" y2="86" stroke="#aab" stroke-width="2" stroke-linecap="round"/>
              <circle id="pendulumBob" cx="0" cy="86" r="8.5" fill="#ffd166" stroke="#c88" stroke-width="1.5"/>
            </g>
            <g id="marks"></g>
            <g id="hands">
              <line id="hourHand" x1="0" y1="0" x2="0" y2="-60" stroke-linecap="round" stroke-width="8" stroke="#a3f6ff"/>
              <line id="minuteHand" x1="0" y1="0" x2="0" y2="-90" stroke-linecap="round" stroke-width="5" stroke="#e6fbff"/>
              <line id="secondHand" x1="0" y1="0" x2="0" y2="-110" stroke-linecap="round" stroke-width="2" stroke="#ff6b6b"/>
            </g>
            <circle r="6" fill="#00121a" stroke="#66d9ff" stroke-width="1.2"></circle>
          </g>
        </svg>
        <div id="dateText" class="dateText neon">—</div>
      </div>

      <div id="toolsCard" class="card">
        <h3 class="toolsTitle">无聊小工具</h3>
        <div id="toolButtons" class="toolButtons" role="toolbar" aria-label="工具按钮组">
          <button type="button" data-tool="calculator" aria-pressed="false">计算器</button>
          <button type="button" data-tool="stopwatch" aria-pressed="false">秒表</button>
          <button type="button" data-tool="pomodoro" aria-pressed="false">番茄钟</button>
          <button type="button" data-tool="worldClocks" aria-pressed="false">世界时钟</button>
          <button type="button" data-tool="calendar" aria-pressed="false">日历</button>
          <button type="button" data-tool="passwordGen" aria-pressed="false">随机密码</button>
          <button type="button" data-tool="dailyQuote" aria-pressed="false">每日名言</button>
        </div>
        <div id="toolArea" class="toolArea">
          <div class="hint">点击上方按钮加载对应小工具</div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/static/js/main.js"></script>
  <script type="module" src="/static/js/clock.js"></script>
</body>
</html>
